version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - echo "Current directory:"
            - pwd
            - echo "Listing files:"
            - ls -la
            - echo "Installing pnpm:"
            - npm install -g pnpm
            - echo "Installing dependencies:"
            - pnpm install
        build:
          commands:
            - echo "Building application:"
            - echo "NODE_PATH=$PWD/node_modules"
            - export NODE_PATH=$PWD/node_modules
            - pnpm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
    appRoot: frontend

